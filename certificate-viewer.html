<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080b10">
    <meta
      name="description"
      content="View certificate in a secure, read-only format."
    >
    <title>Certificate Viewer</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <style>
      :root {
        color-scheme: dark;
        --paper: #080b10;
        --ink: #edf2f8;
        --line: #252d39;
        --green: #c3f76a;
        --green-deep: #90c34a;
        --muted: #929cac;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(ellipse at 50% 0%, rgb(195 247 106 / 7%), transparent 38%),
          var(--paper);
        color: var(--ink);
        font-family: "Segoe UI", Inter, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 32px 20px;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      .viewer-shell {
        width: min(1100px, 100%);
      }

      .viewer-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
        padding: 0 4px;
      }

      .viewer-header h1 {
        margin: 0;
        font-size: clamp(20px, 2vw, 28px);
        letter-spacing: -0.05em;
      }

      .viewer-header a {
        color: var(--ink);
        text-decoration: none;
      }

      .viewer-stage {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--line);
        background: #0d121a;
        box-shadow: 0 24px 80px rgb(0 0 0 / 42%);
      }

      .cert-image-wrap {
        position: relative;
        display: grid;
        place-items: center;
        padding: 18px;
        background: repeating-linear-gradient(
          0deg,
          rgb(255 255 255 / 0.025),
          rgb(255 255 255 / 0.025) 1px,
          transparent 1px,
          transparent 4px
        );
      }

      .cert-image {
        display: block;
        width: min(100%, 920px);
        max-height: 80vh;
        object-fit: contain;
        border: 1px solid #343c48;
        background: #fff;
        box-shadow: 0 14px 36px rgb(0 0 0 / 35%);
        pointer-events: none;
        user-drag: none;
        -webkit-user-drag: none;
      }

      .watermark {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: clamp(40px, 8vw, 140px);
        font-weight: 800;
        letter-spacing: 0.11em;
        color: rgb(8 11 16 / 18%);
        text-transform: uppercase;
        pointer-events: none;
        transform: rotate(-28deg);
      }

      .viewer-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      .viewer-badge {
        padding: 9px 12px;
        border: 1px solid var(--line);
        background: #0d121a;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .viewer-shell {
        animation: viewer-enter 700ms cubic-bezier(0.2, 0.75, 0.25, 1) both;
      }

      .viewer-header a {
        color: var(--green);
        transition: color 180ms ease;
      }

      .viewer-header a:hover {
        color: #e0ffad;
      }

      @keyframes viewer-enter {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }

      @media (max-width: 640px) {
        body {
          padding: 16px 12px;
        }

        .viewer-header {
          flex-direction: column;
          align-items: flex-start;
        }

        .cert-image-wrap {
          padding: 10px;
        }
      }
    </style>
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body>
    <div class="viewer-shell">
      <div class="viewer-header">
        <h1 id="viewer-title">Certificate viewer</h1>
        <a href="index.html#certificates">← Back to certificates</a>
      </div>

      <div class="viewer-stage" aria-live="polite">
        <div class="cert-image-wrap">
          <div class="watermark">View only</div>
          <img
            id="cert-image"
            class="cert-image"
            alt="Certificate preview"
            src="certificate_CION-7098.png"
            draggable="false"
          >
        </div>
      </div>

      <div class="viewer-badges">
        <span class="viewer-badge">Read-only</span>
        <span class="viewer-badge">No direct download</span>
        <span class="viewer-badge">Protected viewing</span>
      </div>
    </div>

    <script>
      const certMap = {
        '7098': {
          title: 'Web Design Certificate — 7098',
          src: 'certificate_CION-7098.png'
        },
        '13750': {
          title: 'CCNA Certificate — 13750',
          src: 'certificate_CION-13750.png'
        }
      };

      const params = new URLSearchParams(window.location.search);
      const key = params.get('certificate') || '7098';
      const cert = certMap[key] || certMap['7098'];
      const image = document.getElementById('cert-image');
      const title = document.getElementById('viewer-title');

      if (image) {
        image.src = cert.src;
        image.alt = cert.title;
      }

      if (title) {
        title.textContent = cert.title;
      }

      document.addEventListener('contextmenu', (event) => event.preventDefault());
      document.addEventListener('dragstart', (event) => event.preventDefault());
      document.addEventListener('selectstart', (event) => event.preventDefault());

      document.addEventListener('keydown', (event) => {
        const blocked = [
          'PrintScreen',
          's',
          'S',
          'p',
          'P',
          'c',
          'C',
          'u',
          'U'
        ];

        if (
          event.key === 'PrintScreen' ||
          event.key === 'F12' ||
          blocked.includes(event.key) && (event.ctrlKey || event.metaKey)
        ) {
          event.preventDefault();
        }
      });

      window.addEventListener('beforeprint', (event) => {
        event.preventDefault();
      });
    </script>
  </body>
</html>
